name: CI

env:
  # Must match what the app loads (config.py defaults / Dockerfile build args)
  SPACY_MODEL: en_core_web_sm
  EMBEDDING_MODEL: all-MiniLM-L6-v2
  TORCH_VERSION: "2.14.1"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Python tests ────────────────────────────────────────────────────
  test:
    name: Python Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          python -m spacy download "${SPACY_MODEL}"

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.EMBEDDING_MODEL }}

      # No GROQ_API_KEY on purpose: the suite must not need one.
      - name: Run tests with coverage
        run: python -m pytest -q --cov=. --cov-report=term-missing

  # ── Python linting ──────────────────────────────────────────────────
  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install black isort flake8

      - name: Check black formatting
        run: black --check --line-length=100 --exclude='/(\.venv|venv|frontend)/' .

      - name: Check isort imports
        run: isort --check-only --profile=black --line-length=100 --skip .venv --skip venv --skip frontend .

      - name: Run flake8
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503,E501 --exclude=.venv,venv,__pycache__,frontend .

  # ── Frontend build & lint ───────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker image build (no push) ────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: financial-ai-agent:ci
          build-args: |
            SPACY_MODEL=${{ env.SPACY_MODEL }}
            EMBEDDING_MODEL=${{ env.EMBEDDING_MODEL }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
