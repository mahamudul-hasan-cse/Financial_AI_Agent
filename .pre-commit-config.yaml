# Pre-commit hooks for the Financial AI Agent project.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  # ── Python: black formatter ───────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: "24.10.0"
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # ── Python: isort import sorter ───────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: "5.13.2"
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # ── Python: flake8 linter ─────────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: "7.1.1"
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503,E501
          - --exclude=.venv,venv,__pycache__,frontend/node_modules

  # ── Frontend: prettier formatter ──────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json]
        args: [--single-quote, --trailing-comma=all]
        files: ^frontend/src/
        additional_dependencies: ["prettier@3.5.3"]

  # ── Frontend: eslint linter ───────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --max-warnings=0'
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false

  # ── General: trailing whitespace, end-of-file, YAML check ────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/node_modules/
      - id: check-added-large-files
        args: [--maxkb=500]
