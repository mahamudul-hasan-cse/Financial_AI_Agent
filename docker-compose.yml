# =============================================================================
# Financial AI Agent — Docker Compose
# =============================================================================
#
# Default (Groq cloud LLM):
#   docker compose up --build
#
# With local Ollama LLM:
#   docker compose --profile ollama up --build
#   # Then pull the model into the Ollama container once:
#   docker exec financial-ai-ollama ollama pull qwen2.5:3b
#
# Access the app at: http://localhost:8001  (or $PORT)
# =============================================================================

services:

  # ── Main application ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-ai-agent:latest
    container_name: financial-ai-agent
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8001}"
      # Defaults only — values set in .env or your shell take precedence
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8001}"
      # When LLM_PROVIDER=ollama, point to the compose service, not localhost
      OLLAMA_HOST: "${OLLAMA_HOST:-http://ollama:11434}"
      DATABASE_PATH: /app/data/financial_agent.db
    volumes:
      # Persist generated charts/Excel reports and the SQLite database
      - ./outputs:/app/outputs
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:$${PORT}/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Ollama local LLM (optional) ─────────────────────────────────────────────
  # Activate with: docker compose --profile ollama up
  # After first start, pull the model once:
  #   docker exec financial-ai-ollama ollama pull qwen2.5:3b
  # Then set LLM_PROVIDER=ollama in your .env
  ollama:
    image: ollama/ollama:latest
    container_name: financial-ai-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      # Named volume keeps downloaded models across container restarts
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  # SQLite database (sessions, messages, watchlists, alerts)
  app_data:
    name: financial-ai-agent-data
  # Stores Ollama model weights (populated on first pull, persisted forever)
  ollama_models:
    name: financial-ai-ollama-models
